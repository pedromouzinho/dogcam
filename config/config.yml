# MQTT para o cérebro (fase 2): Mosquitto só na rede Docker interna "mqtt".
mqtt:
  enabled: true
  host: mosquitto
  port: 1883

auth:
  enabled: true
  failed_login_rate_limit: 1/second;5/minute;20/hour
  # O tailscale serve chega ao Frigate pelo gateway da rede Docker; confiar no
  # X-Forwarded-For dele para o limite de logins se aplicar a cada dispositivo.
  trusted_proxies:
    - 172.16.0.0/12

detectors:
  ov:
    type: openvino
    device: GPU

# YOLOv9-s 320 (gerado com modelos/yolov9-export.Dockerfile; o .onnx fica em
# config/model_cache, fora do git). Em 2026-10-07 ganhou ao SSDLite em todas as
# situações do clip media/cao-real.mp4, mas demora ~45 ms por recorte na GPU:
# por isso a deteção está a 3 imagens/s.
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  hwaccel_args: preset-vaapi

go2rtc:
  # O iPad (app OctoStream) empurra o vídeo por RTMP para
  # rtmp://192.168.1.249:1935/quarto_ipad. A porta só está publicada no IP da
  # rede local (docker-compose.yml) e filtrada para 192.168.1.0/24 (DOCKER-USER).
  rtmp:
    listen: ":1935"
  streams:
    quarto_ipad: # vazio: a fonte é o envio RTMP do iPad

objects:
  track:
    - dog

review:
  alerts:
    labels:
      - dog

record:
  enabled: true
  continuous:
    days: 2
  alerts:
    retain:
      days: 14
      mode: all
  detections:
    retain:
      days: 14
      mode: all

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  # Câmara provisória: iPad no quarto (OctoStream, RTMP 720p30, sem áudio).
  # Lê o restream do go2rtc; se o iPad cair, o ffmpeg do Frigate volta a tentar
  # sozinho e retoma quando a app voltar a enviar.
  quarto_ipad:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/quarto_ipad
          # generic: tempos pelo relógio do servidor; o iPad salta os DTS a cada ~1 min
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 3
    # Zonas desenhadas com o Pedro em 2026-10-07 (iPad na posição final; imagens em
    # media/zonas/). Números sem zeros à direita: o Frigate 0.17 compara-os como
    # texto com "1.0" e "1.000" põe-no em modo de segurança. O Frigate usa o ponto do meio da parte de baixo da caixa do cão.
    # descanso sobrepõe-se a quarto de propósito: o cão deitado aí fica nas duas.
    zones:
      cama:
        coordinates: 0.517,0.333,0.591,0.322,0.713,0.336,0.791,0.364,0.869,0.364,0.978,0.333,1,0.375,1,1,0.505,1,0.502,0.542
      descanso:
        coordinates: 0.267,0.375,0.513,0.375,0.502,0.542,0.505,1,0.267,1,0.181,0.694,0.212,0.611
      porta_varanda:
        coordinates: 0.42,0,0.666,0,0.646,0.211,0.591,0.222,0.572,0.292,0.431,0.306,0.408,0.211
      tigelas:
        coordinates: 0.591,0.201,0.857,0.211,0.869,0.364,0.791,0.364,0.713,0.336,0.591,0.322,0.572,0.292,0.591,0.222
      quarto:
        coordinates: 0,0.667,0.173,0.667,0.326,0.264,0.408,0.211,0.431,0.306,0.572,0.292,0.591,0.322,0.517,0.333,0.502,0.542,0.505,1,0,1
version: 0.17-0
