services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    devices:
      - /dev/dri:/dev/dri # GPU Intel: descodificação VAAPI e deteção OpenVINO
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate # disco virtual de 150 GB (limite de espaço)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      FRIGATE_JWT_SECRET: ${FRIGATE_JWT_SECRET}
    networks:
      - default
      - mqtt
    # Nunca 0.0.0.0: o Docker passa por cima do ufw.
    # Só a porta autenticada; a 5000 (sem login) não é publicada.
    ports:
      - "127.0.0.1:8971:8971"
      - "100.103.233.84:8971:8971" # IP Tailscale do dogcam
      # RTMP do iPad: só no IP da rede local. O Docker passa por cima do ufw,
      # por isso a origem é limitada a 192.168.1.0/24 na cadeia DOCKER-USER
      # (/etc/ufw/after.rules).
      - "192.168.1.69:1935:1935" # cabo (principal; o iPad envia para aqui)
      - "192.168.1.249:1935:1935" # Wi-Fi (reserva)

  # MQTT entre o Frigate e o cérebro. Sem portas publicadas: só na rede "mqtt".
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - mqtt

  # Cérebro DogCam (fase 2): regras sobre os eventos MQTT do Frigate e alertas no
  # Telegram. Só recebe do .env os segredos de que precisa.
  cerebro:
    build: ./cerebro
    image: dogcam-cerebro:1.0
    container_name: cerebro
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}   # Claude Haiku (fase 2B)
      TZ: Europe/Lisbon
    volumes:
      - ./cerebro/config.yaml:/config/config.yaml:ro
      - ./scripts:/scripts:ro              # energia.sh (bateria e CPU)
      - ./storage/cerebro:/dados           # SQLite, no disco virtual do Frigate
    networks:
      - default                            # API do Frigate, Telegram e healthchecks.io
      - mqtt

networks:
  # internal: true -> sem saída para a rede local nem para a internet.
  mqtt:
    internal: true
