# Configuração do cérebro DogCam. Depois de mudar: docker compose restart cerebro
camara: quarto_ipad
frigate_url: http://frigate:5000   # API interna do Frigate (rede Docker, não publicada)
mqtt_host: mosquitto
sqlite: /dados/cerebro.db

limites:
  anda_demasiado_s: 120     # ANDA DEMASIADO: em movimento fora de cama/descanso durante mais disto
  varanda_s: 600            # VARANDA: alerta se não voltar da varanda ao fim disto
  desapareceu_s: 60         # DESAPARECEU: sem ser visto e sem movimento durante isto
  sem_imagem_s: 30          # CÂMARA SEM IMAGEM durante isto
  sem_imagem_longa_s: 300   # ... e ao fim disto: "abre e fecha a OctoStream no iPad" (uma vez por falha)
  repetir_alerta_s: 300     # não repetir o mesmo alerta antes disto
  tolerancia_perda_s: 15    # perda breve da deteção que não interrompe os "2 min seguidos"
  cpu_minima_mhz: 1000      # SERVIDOR: CPU presa abaixo disto (PROCHOT)
  pausa_padrao_min: 30      # /pausa sem número
  diario_horas: 12          # /diario

  # SUSPEITA (fase 2B): cão em cama/descanso quase parado mas a mexer-se dentro da caixa, ou de pé
  vigia_s: 0.4              # com o cão na cama/descanso: ler uma imagem e medir o movimento na caixa
  suspeita_s: 5             # movimento dentro da caixa (ou de pé) durante isto -> suspeita
  movimento_caixa_min: 0.02 # fração dos píxeis da caixa que mudam entre imagens para contar como "a mexer"
  movimento_pausa_s: 1.5    # paragem curta que não interrompe a suspeita
  duvida_s: 20              # NA DÚVIDA, AVISA: suspeita sem confirmação do Claude durante isto
  claude_modelo: claude-haiku-5-5
  claude_limiar: 0.6        # alerta se algum valor do JSON for >= isto
  claude_intervalo_s: 30    # no máximo 1 chamada a cada isto
  claude_por_dia: 300       # e no máximo isto por dia (depois só regras locais)
  claude_tempo_max_s: 15    # mais do que isto conta como falha
  claude_margem: 0.5        # margem à volta da caixa do cão (0,3 cortava a cabeça e o cone)
  claude_lado_minimo_px: 512
  claude_preco_entrada_usd_mtok: 1.0   # Haiku 4.5, para o custo no /diario
  claude_preco_saida_usd_mtok: 5.0

intervalos:
  camara_s: 5               # ler o camera_fps do Frigate e avaliar as regras
  servidor_s: 60            # verificar a energia (scripts/energia.sh)
  healthcheck_s: 60         # ping ao healthchecks.io (só com Frigate e câmara bem)
